<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athena Nails & Spa — Leave a Review</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --marble: #f6f4ef;
    --olive: #5c6b4f;
    --olive-dark: #47523d;
    --gold: #b08d3f;
    --charcoal: #2c2822;
    --line: #ded8c9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--marble);
    color: var(--charcoal);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  main {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .logo {
    width: 120px;
    height: 120px;
    margin: 0 auto 22px;
    display: block;
    border-radius: 50%;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }

  p.sub {
    margin: 0 0 36px;
    font-size: 15px;
    color: #6a6355;
    line-height: 1.5;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  a.link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    color: var(--charcoal);
    text-align: left;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  a.link:hover, a.link:focus-visible {
    border-color: var(--olive);
    transform: translateY(-1px);
  }

  a.link:focus-visible {
    outline: 2px solid var(--olive);
    outline-offset: 2px;
  }

  .icon {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
  }

  .text {
    flex: 1;
  }

  .text .name {
    font-size: 15px;
    font-weight: 600;
  }

  .text .hint {
    font-size: 12.5px;
    color: #837a68;
    margin-top: 1px;
  }

  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #a39a86;
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Athena Nails & Spa logo">
  <h1>Athena Nails &amp; Spa</h1>
  <p class="sub">Thank you for visiting us. If you enjoyed your appointment, a review helps other guests find us.</p>

        <span class="name">Review us on Google</span>

      <span class="text">
        <span class="name">Review us on Yelp</span>
        <span class="hint">Share your experience</span>
      </span>
    </a>
  </div>

  <footer>Scan again anytime — this page never changes.</footer>
</main>
</body>
</html>
